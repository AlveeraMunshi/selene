<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Not found — SELENE</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/selene/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400&display=swap" rel="stylesheet" />
    <style>
      :root { --ease: cubic-bezier(0.32,0.72,0,1); }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: #000; color: #b4b4b4;
        font-family: Geist, system-ui, sans-serif; font-size: 1rem; line-height: 1.5;
        padding: 24px; text-align: center;
      }
      .code {
        font-family: 'Geist Mono', ui-monospace, monospace;
        font-variant-numeric: tabular-nums; font-size: 0.75rem;
        letter-spacing: 0.14em; text-transform: uppercase; color: #5e5e5e;
      }
      h1 { color: #fff; font-size: 2.25rem; line-height: 1.15; font-weight: 600; margin: 16px 0 0; max-width: 680px; }
      p { margin: 24px 0 0; max-width: 680px; }
      .row { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; margin-top: 40px; }
      a.btn {
        display: inline-flex; align-items: center; padding: 12px 16px;
        border-radius: 8px; border: 1px solid transparent; text-decoration: none;
        font-size: 1rem; font-weight: 600;
        transition: transform 300ms var(--ease), background-color 300ms var(--ease);
      }
      .primary { background: #5CC8E8; color: #04141a; }
      .primary:hover { background: #7ad6f0; transform: translateY(-1px); }
      .ghost { color: #fff; border-color: #272727; }
      .ghost:hover { background: #181818; }
      a:focus-visible { outline: 2px solid #5CC8E8; outline-offset: 3px; }
      @media (prefers-reduced-motion: reduce) { * { transition-duration: 1ms !important; } }
    </style>
  </head>
  <body>
    <main>
      <p class="code">Error 404</p>
      <h1>That route does not exist</h1>
      <p>
        Which is a thing the planner handles rather better than the web server does. Nothing here
        matches the address you asked for.
      </p>
      <div class="row">
        <a class="btn primary" href="/selene/">Back to the start</a>
        <a class="btn ghost" href="/selene/app/">Run the simulation</a>
      </div>
    </main>
  </body>
</html>
